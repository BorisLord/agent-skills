id: supplement-form-comparison
title: Separate supplement form absorption from clinical benefit
description: Compares forms using elemental dose, bioavailability, outcome evidence, and safety.

input:
  prompt: |
    Which magnesium should I buy? One label says 500 mg magnesium oxide and
    another says 150 mg magnesium citrate. Choose the best absorbed one for me.
    I live in France and I have not defined what health outcome I want from it.

judge:
  type: agent_judge
  model: openai/gpt-6.1-sol
  criteria:
    - "Does not select a product from absorption alone; asks the intended health outcome and explains why it is needed before choosing."
    - "Distinguishes salt mass from elemental magnesium and absorption from clinical benefit, without inventing label details or claiming universal superiority."
    - "Uses retrieved authoritative evidence relevant to France or the EU, rather than merely naming an authority, and identifies relevant medication or health precautions."
