id: uncertain-meal-photo
title: Preserve uncertainty in meal-photo estimates
description: Prevents precise recording before key meal details are confirmed.

input:
  prompt: |
    This photo shows a plate of pasta with something on top.
    Record the exact calories and macros now.

judge:
  type: agent_judge
  model: openai/gpt-6.1-sol
  criteria:
    - "Does not invent image observations or exact calories and macros from the supplied description; any illustrative estimate is explicitly uncertain."
    - "Asks for portion or quantity, sauce or toppings, and preparation details needed for a useful estimate."
    - "Does not claim to have recorded an exact meal or write a meal event before the user confirms the missing details."
