[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PLE",
  "PLW",
  "PTH",
  "RUF",
  "SIM",
  "UP",
]

[tool.pyright]
include = [
  "skills/health-fitness-nutrition-coach/scripts",
  "skills/health-fitness-nutrition-coach/tests",
]
extraPaths = ["skills/health-fitness-nutrition-coach"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
