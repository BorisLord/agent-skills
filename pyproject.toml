[project]
name = "agent-skills"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.4", "ty==0.0.99"]

[tool.uv]
package = false
python-preference = "system"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "ANN",
  "ARG",
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PLE",
  "PLW",
  "PTH",
  "RUF",
  "SIM",
  "UP",
]

[tool.ty.src]
include = [
  "skills/health-fitness-nutrition-coach/scripts",
  "skills/health-fitness-nutrition-coach/tests",
]

[tool.ty.environment]
extra-paths = [
  "skills/health-fitness-nutrition-coach",
  "skills/health-fitness-nutrition-coach/scripts",
]
python-version = "3.11"

[tool.ty.rules]
all = "error"

[tool.rumdl]
include = ["README.md", "skills/**/*.md"]
respect-gitignore = true
# Skill prose uses one paragraph per source line.
disable = ["MD013"]
